name: mmy_ye
description: النظام الإداري الإعلامي - الإعلام الحربي اليمني (Android + Windows، يعمل دون اتصال)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  cryptography: ^2.7.0
  archive: ^3.6.1
  crypto: ^3.0.3
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.0.6
  share_plus: ^9.0.0
  flutter_svg: ^2.0.10
  material_symbols_icons: ^4.2785.1
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
